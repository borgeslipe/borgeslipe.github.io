backend:
  name: github
  repo: borgeslipe/borgeslipe.github.io
  branch: main

media_folder: "imagens"
public_folder: "/imagens"

collections:
  - name: "site"
    label: "BORGESSFUT"
    files:
      - name: "home"
        label: "Página inicial"
        file: "content/home.json"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Texto", name: "texto", widget: "text" }

      - name: "noticias"
        label: "Notícias"
        file: "content/noticias.json"
        fields:
          - label: "Notícias"
            label_singular: "Notícia"
            name: "itens"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Subtítulo (opcional)", name: "subtitulo", widget: "string", required: false }
              - { label: "Seção", name: "secao", widget: "select", options: ["Futebol", "Outros esportes"], default: "Futebol", required: false }
              - { label: "Esporte (só para Outros esportes)", name: "esporte", widget: "string", required: false }
              - { label: "Data", name: "data", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Texto", name: "texto", widget: "textorico" }
              - { label: "Imagem", name: "imagem", widget: "image", required: false }
              - { label: "Link da fonte original (opcional)", name: "link", widget: "string", required: false }
              - label: "Projeto (opcional)"
                name: "projeto"
                widget: "relation"
                collection: "site"
                file: "projetos"
                search_fields: ["itens.*.nome"]
                display_fields: ["itens.*.nome"]
                value_field: "itens.*.nome"
                required: false

      - name: "projetos"
        label: "Projetos"
        file: "content/projetos.json"
        fields:
          - label: "Projetos"
            label_singular: "Projeto"
            name: "itens"
            widget: "list"
            summary: "{{fields.nome}}"
            fields:
              - { label: "Nome do projeto", name: "nome", widget: "string" }
              - { label: "Tipo", name: "categoria", widget: "select", options: ["Vídeo", "Texto"], required: false }
              - { label: "Legenda curta (aparece no cartão)", name: "resumo", widget: "string" }
              - { label: "Logo do projeto", name: "imagem", widget: "image", required: false }
              - { label: "Bio do projeto (página do projeto)", name: "texto", widget: "text" }
              - label: "Vídeos"
                label_singular: "Vídeo"
                name: "videos"
                widget: "list"
                required: false
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título do vídeo", name: "titulo", widget: "string" }
                  - { label: "Link do vídeo (YouTube, Instagram, TikTok...)", name: "link", widget: "string" }

      - name: "transmissoes"
        label: "Portfólio: Transmissões"
        file: "content/transmissoes.json"
        fields:
          - label: "Transmissões"
            label_singular: "Transmissão"
            name: "itens"
            widget: "list"
            add_to_top: true
            summary: "{{fields.data}} · {{fields.jogo}}"
            fields:
              - { label: "Data", name: "data", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Esporte", name: "esporte", widget: "string", default: "Futebol" }
              - { label: "Jogo ou evento", name: "jogo", widget: "string" }
              - { label: "Competição", name: "competicao", widget: "string" }
              - { label: "Função (ex.: Repórter Brasil, Comentarista, Produtor)", name: "funcao", widget: "string" }
              - { label: "Link do vídeo (YouTube)", name: "link", widget: "string", required: false }
              - { label: "Imagem de capa (só se o link não for do YouTube)", name: "imagem", widget: "image", required: false }

      - name: "programas"
        label: "Portfólio: Programas esportivos"
        file: "content/programas.json"
        fields:
          - label: "Programas"
            label_singular: "Programa"
            name: "itens"
            widget: "list"
            add_to_top: true
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Nome do programa ou edição", name: "titulo", widget: "string" }
              - { label: "Data", name: "data", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD", required: false }
              - { label: "Sua função", name: "funcao", widget: "string", required: false }
              - { label: "Descrição", name: "descricao", widget: "text", required: false }
              - { label: "Link do vídeo (YouTube)", name: "link", widget: "string", required: false }
              - { label: "Imagem de capa (só se o link não for do YouTube)", name: "imagem", widget: "image", required: false }

      - name: "portfolio"
        label: "Portfólio: Matérias de fora"
        file: "content/portfolio.json"
        fields:
          - label: "Matérias"
            label_singular: "Matéria"
            name: "itens"
            widget: "list"
            add_to_top: true
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Tipo", name: "tipo", widget: "select", options: ["Texto", "Vídeo", "Áudio", "Foto", "Outro"], required: false }
              - { label: "Onde foi publicado / para quem", name: "veiculo", widget: "string", required: false }
              - { label: "Data", name: "data", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD", required: false }
              - { label: "Resumo", name: "resumo", widget: "text", required: false }
              - { label: "Imagem", name: "imagem", widget: "image", required: false }
              - { label: "Link da matéria", name: "link", widget: "string", required: false }
