backend:
  name: github
  repo: borgeslipe/borgeslipe.github.io
  branch: main

media_folder: "imagens"
public_folder: "/imagens"

collections:
  - name: "site"
    label: "BORGESSFUT"
    files:
      - name: "home"
        label: "Página inicial"
        file: "content/home.json"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Texto", name: "texto", widget: "text" }
