backend:
  name: github
  repo: borgeslipe/borgeslipe.github.io
  branch: main

media_folder: "imagens"
public_folder: "/imagens"

collections:
  - name: "site"
    label: "BORGESSFUT"
    files:
      - name: "home"
        label: "Página inicial"
        file: "content/home.json"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Texto", name: "texto", widget: "text" }

      - name: "noticias"
        label: "Notícias"
        file: "content/noticias.json"
        fields:
          - label: "Notícias"
            label_singular: "Notícia"
            name: "itens"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Subtítulo (opcional)", name: "subtitulo", widget: "string", required: false }
              - { label: "Data", name: "data", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Texto", name: "texto", widget: "text" }
              - { label: "Imagem", name: "imagem", widget: "image", required: false }
              - { label: "Link da fonte original (opcional)", name: "link", widget: "string", required: false }
              - label: "Projeto (opcional)"
                name: "projeto"
                widget: "relation"
                collection: "site"
                file: "projetos"
                search_fields: ["itens.*.nome"]
                display_fields: ["itens.*.nome"]
                value_field: "itens.*.nome"
                required: false

      - name: "projetos"
        label: "Projetos"
        file: "content/projetos.json"
        fields:
          - label: "Projetos"
            label_singular: "Projeto"
            name: "itens"
            widget: "list"
            summary: "{{fields.nome}}"
            fields:
              - { label: "Nome do projeto", name: "nome", widget: "string" }
              - { label: "Tipo", name: "categoria", widget: "select", options: ["Vídeo", "Texto"], required: false }
              - { label: "Legenda curta (aparece no cartão)", name: "resumo", widget: "string" }
              - { label: "Logo do projeto", name: "imagem", widget: "image", required: false }
              - { label: "Bio do projeto (página do projeto)", name: "texto", widget: "text" }
              - label: "Vídeos"
                label_singular: "Vídeo"
                name: "videos"
                widget: "list"
                required: false
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título do vídeo", name: "titulo", widget: "string" }
                  - { label: "Link do vídeo (YouTube, Instagram, TikTok...)", name: "link", widget: "string" }
