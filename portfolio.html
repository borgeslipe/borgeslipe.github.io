<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfólio | BORGESSFUT</title>
  <link rel="icon" href="logo-site.png">
  <meta name="description" content="Portfólio de Felipe Borges, estudante de jornalismo da UERJ.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BORGESSFUT">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Portfólio | BORGESSFUT">
  <meta property="og:description" content="Portfólio de Felipe Borges, estudante de jornalismo da UERJ.">
  <meta property="og:image" content="https://borgessfut.com.br/compartilhar.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="cabecalho"></div>

  <main class="pagina larga">
    <h1>Portfólio</h1>
    <p class="lead">Portfólio de Felipe Borges, estudante de jornalismo da UERJ.</p>

    <div class="abas" role="tablist">
      <button type="button" class="aba ativa" role="tab" data-aba="transmissoes" aria-selected="true">Transmissões <span class="conta" id="n-transmissoes"></span></button>
      <button type="button" class="aba" role="tab" data-aba="programas" aria-selected="false">Programas esportivos <span class="conta" id="n-programas"></span></button>
      <button type="button" class="aba" role="tab" data-aba="materias" aria-selected="false">Matérias de fora <span class="conta" id="n-materias"></span></button>
    </div>

    <div id="aba-transmissoes">
      <div class="filtros">
        <input type="search" id="tx-busca" placeholder="Buscar jogo, time ou competição" aria-label="Buscar">
        <select id="tx-f1" aria-label="Competição"><option value="">Todas as competições</option></select>
        <select id="tx-f2" aria-label="Função"><option value="">Todas as funções</option></select>
      </div>
      <p class="contagem" id="tx-contagem"></p>
      <div class="tabela" id="tx-tabela"></div>
    </div>

    <div id="aba-programas" hidden>
      <div class="filtros">
        <input type="search" id="pg-busca" placeholder="Buscar programa ou função" aria-label="Buscar">
        <select id="pg-f1" aria-label="Programa"><option value="">Todos os programas</option></select>
        <select id="pg-f2" aria-label="Função"><option value="">Todas as funções</option></select>
      </div>
      <p class="contagem" id="pg-contagem"></p>
      <div class="tabela" id="pg-tabela"></div>
    </div>

    <div id="aba-materias" hidden>
      <div class="cards-noticias" id="lista-materias"></div>
    </div>
  </main>

  <div id="rodape"></div>
  <script src="site.js"></script>
  <script>
    var MESES_CURTOS = ['jan.', 'fev.', 'mar.', 'abr.', 'mai.', 'jun.', 'jul.', 'ago.', 'set.', 'out.', 'nov.', 'dez.'];
    var MESES_LONGOS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    var ABAS = ['transmissoes', 'programas', 'materias'];
    var PODE_HOVER = window.matchMedia && window.matchMedia('(hover: hover)').matches;

    function el(tag, cls, txt) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (txt) e.textContent = txt;
      return e;
    }
    function norm(s) {
      return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }
    function partes(s) {
      var p = (s || '').slice(0, 10).split('-');
      return p.length === 3 ? p : null;
    }
    function dataCurta(s) {
      var p = partes(s);
      return p ? Number(p[2]) + ' ' + MESES_CURTOS[Number(p[1]) - 1] + ' ' + p[0] : '';
    }
    function dataLonga(s) {
      var p = partes(s);
      return p ? Number(p[2]) + ' de ' + MESES_CURTOS[Number(p[1]) - 1] + ' de ' + p[0] : '';
    }
    function mesAno(s) {
      var p = partes(s);
      return p ? MESES_LONGOS[Number(p[1]) - 1] + ' de ' + p[0] : '';
    }
    function youtubeId(url) {
      var m = (url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/);
      return m ? m[1] : null;
    }
    function linkOk(u) { return /^https?:\/\//.test(u || ''); }
    function thumbDe(t) {
      if (t.imagem) return t.imagem;
      var id = youtubeId(t.link);
      return id ? 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg' : '';
    }
    function carregar(url) {
      return fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (d) { return d.itens || []; })
        .catch(function () { return []; });
    }
    function porData(lista) {
      return lista.slice().sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); });
    }

    // ---------- Miniatura que acompanha o mouse ----------
    var prev = null, prevImg = null;
    function criarPrev() {
      prev = el('div', 'prev');
      prevImg = el('img');
      prevImg.alt = '';
      prev.appendChild(prevImg);
      document.body.appendChild(prev);
    }
    function moverPrev(x, y) {
      if (!prev) return;
      var w = 286, h = 166;
      var nx = x + 20, ny = y + 20;
      if (nx + w > window.innerWidth - 10) nx = x - w - 20;
      if (ny + h > window.innerHeight - 10) ny = y - h - 20;
      prev.style.left = Math.max(10, nx) + 'px';
      prev.style.top = Math.max(10, ny) + 'px';
    }
    function mostrarPrev(src, x, y) {
      if (!prev) criarPrev();
      prevImg.src = src;
      moverPrev(x, y);
      prev.classList.add('on');
    }
    function esconderPrev() {
      if (prev) prev.classList.remove('on');
    }

    // ---------- Lista interativa (usada em Transmissões e Programas) ----------
    function tabelaInterativa(o) {
      var itens = porData(o.itens);
      var tabela = document.getElementById(o.prefixo + '-tabela');
      var campoBusca = document.getElementById(o.prefixo + '-busca');
      var sel1 = document.getElementById(o.prefixo + '-f1');
      var sel2 = document.getElementById(o.prefixo + '-f2');
      var contagem = document.getElementById(o.prefixo + '-contagem');

      function linha(t) {
        var wrap = el('div', 'linha');
        var tr = el('div', 'tr');
        tr.tabIndex = 0;
        tr.setAttribute('role', 'button');
        tr.setAttribute('aria-expanded', 'false');

        tr.appendChild(el('span', 'c-data', dataCurta(t.data)));
        tr.appendChild(el('span', 'c-jogo', o.titulo(t)));
        tr.appendChild(el('span', 'c-comp', o.col3(t)));
        tr.appendChild(el('span', 'c-func', t.funcao));
        tr.appendChild(el('span', 'c-meta', [dataCurta(t.data), o.col3(t), t.funcao].filter(Boolean).join(' · ')));
        tr.appendChild(el('span', 'c-seta', '▾'));
        wrap.appendChild(tr);

        var thumb = thumbDe(t);
        var temLink = linkOk(t.link);
        var det = el('div', 'det');
        var caixa = null;

        if (thumb || temLink) {
          caixa = el(temLink ? 'a' : 'div', 'det-thumb');
          if (temLink) {
            caixa.href = t.link;
            caixa.target = '_blank';
            caixa.rel = 'noopener';
            caixa.setAttribute('aria-label', 'Assistir ' + o.titulo(t));
          }
          caixa.appendChild(el('span', 'play', '▶'));
          det.appendChild(caixa);
        }

        var info = el('div', 'det-info');
        info.appendChild(el('h3', '', o.titulo(t)));
        var sub = o.sub(t);
        if (sub) info.appendChild(el('p', '', sub));
        if (t.funcao) info.appendChild(el('p', '', 'Função: ' + t.funcao));
        if (t.data) info.appendChild(el('p', '', dataLonga(t.data)));
        if (temLink) {
          var b = el('a', 'botao', 'Assistir ▶');
          b.href = t.link;
          b.target = '_blank';
          b.rel = 'noopener';
          info.appendChild(b);
        } else {
          info.appendChild(el('p', '', 'Vídeo em breve.'));
        }
        det.appendChild(info);
        wrap.appendChild(det);

        function alternar() {
          var aberta = wrap.classList.toggle('aberta');
          tr.setAttribute('aria-expanded', aberta ? 'true' : 'false');
          if (aberta && caixa && thumb && !caixa.querySelector('img')) {
            var im = el('img');
            im.alt = '';
            im.src = thumb;
            caixa.insertBefore(im, caixa.firstChild);
          }
          esconderPrev();
        }
        tr.addEventListener('click', alternar);
        tr.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternar(); }
        });

        if (thumb && PODE_HOVER) {
          tr.addEventListener('mouseenter', function (e) {
            if (!wrap.classList.contains('aberta')) mostrarPrev(thumb, e.clientX, e.clientY);
          });
          tr.addEventListener('mousemove', function (e) { moverPrev(e.clientX, e.clientY); });
          tr.addEventListener('mouseleave', esconderPrev);
        }
        return wrap;
      }

      function desenhar() {
        var q = norm(campoBusca.value);
        var v1 = sel1.value;
        var v2 = sel2.value;

        var lista = itens.filter(function (t) {
          if (v1 && o.filtro1(t) !== v1) return false;
          if (v2 && (t.funcao || '').split(' ')[0] !== v2) return false;
          if (q && norm(o.busca(t)).indexOf(q) < 0) return false;
          return true;
        });

        tabela.innerHTML = '';
        esconderPrev();
        contagem.textContent = lista.length + (lista.length === 1 ? o.singular : o.plural);

        if (!lista.length) {
          tabela.appendChild(el('p', 'vazio', o.vazio));
          return;
        }

        var cab = el('div', 'tr tr-cab');
        o.cab.concat(['']).forEach(function (x) { cab.appendChild(el('span', '', x)); });
        tabela.appendChild(cab);

        var mesAtual = '';
        lista.forEach(function (t) {
          var m = mesAno(t.data);
          if (m !== mesAtual) { mesAtual = m; tabela.appendChild(el('div', 'mes', m)); }
          tabela.appendChild(linha(t));
        });
      }

      // Opções dos filtros
      var op1 = {}, op2 = {};
      itens.forEach(function (t) {
        var a = o.filtro1(t);
        if (a) op1[a] = true;
        var f = (t.funcao || '').split(' ')[0];
        if (f) op2[f] = true;
      });
      Object.keys(op1).sort().forEach(function (c) {
        var op = el('option', '', c); op.value = c; sel1.appendChild(op);
      });
      Object.keys(op2).sort().forEach(function (f) {
        var op = el('option', '', f); op.value = f; sel2.appendChild(op);
      });

      desenhar();
      [campoBusca, sel1, sel2].forEach(function (c) { c.addEventListener('input', desenhar); });
    }

    // ---------- Aba Matérias de fora ----------
    function cartaoMateria(p) {
      var temLink = linkOk(p.link);
      var c = el(temLink ? 'a' : 'div', 'card-noticia');
      if (temLink) { c.href = p.link; c.target = '_blank'; c.rel = 'noopener'; }

      var capa = el('div', 'card-capa');
      if (p.imagem) {
        var im = el('img');
        im.src = p.imagem;
        im.alt = '';
        im.loading = 'lazy';
        capa.appendChild(im);
      }
      c.appendChild(capa);

      var corpo = el('div', 'card-corpo');
      if (p.tipo) corpo.appendChild(el('span', 'etiqueta' + (p.tipo === 'Vídeo' ? '' : ' texto'), p.tipo));
      corpo.appendChild(el('h3', '', p.titulo));
      var linhaMeta = [p.veiculo, dataLonga(p.data)].filter(Boolean).join(' · ');
      if (linhaMeta) corpo.appendChild(el('p', 'card-data', linhaMeta));
      if (p.resumo) corpo.appendChild(el('p', 'card-resumo', p.resumo));
      if (temLink) corpo.appendChild(el('span', 'card-ler', 'Ler matéria ▶'));
      c.appendChild(corpo);
      return c;
    }

    function preencherLista(id, itens, criar, vazio) {
      var area = document.getElementById(id);
      if (!itens.length) {
        area.className = '';
        area.appendChild(el('p', 'vazio', vazio));
        return;
      }
      itens.forEach(function (x) { area.appendChild(criar(x)); });
    }

    // ---------- Abas ----------
    function ir(nome) {
      if (ABAS.indexOf(nome) < 0) nome = 'transmissoes';
      ABAS.forEach(function (a) {
        document.getElementById('aba-' + a).hidden = (a !== nome);
        var b = document.querySelector('[data-aba="' + a + '"]');
        b.classList.toggle('ativa', a === nome);
        b.setAttribute('aria-selected', a === nome ? 'true' : 'false');
      });
      if (history.replaceState) history.replaceState(null, '', '#' + nome);
      esconderPrev();
    }
    document.querySelectorAll('[data-aba]').forEach(function (b) {
      b.addEventListener('click', function () { ir(b.getAttribute('data-aba')); });
    });
    ir(location.hash.replace('#', ''));

    // ---------- Carregar os dados do painel ----------
    Promise.all([
      carregar('content/transmissoes.json'),
      carregar('content/programas.json'),
      carregar('content/portfolio.json')
    ]).then(function (res) {
      var transmissoes = res[0];
      var programas = res[1];
      var materias = porData(res[2]);

      document.getElementById('n-transmissoes').textContent = '(' + transmissoes.length + ')';
      document.getElementById('n-programas').textContent = '(' + programas.length + ')';
      document.getElementById('n-materias').textContent = '(' + materias.length + ')';

      tabelaInterativa({
        itens: transmissoes,
        prefixo: 'tx',
        cab: ['Data', 'Jogo', 'Competição', 'Função'],
        titulo: function (t) { return t.jogo; },
        col3: function (t) { return t.competicao; },
        filtro1: function (t) { return t.competicao; },
        sub: function (t) {
          return [t.competicao, (t.esporte && t.esporte !== 'Futebol') ? t.esporte : ''].filter(Boolean).join(' · ');
        },
        busca: function (t) { return [t.jogo, t.competicao, t.funcao, t.esporte].join(' '); },
        singular: ' transmissão',
        plural: ' transmissões',
        vazio: 'Nenhuma transmissão encontrada.'
      });

      tabelaInterativa({
        itens: programas,
        prefixo: 'pg',
        cab: ['Data', 'Programa', 'Esporte', 'Função'],
        titulo: function (t) { return t.programa || t.titulo; },
        col3: function (t) { return t.esporte; },
        filtro1: function (t) { return t.programa || t.titulo; },
        sub: function (t) { return t.esporte; },
        busca: function (t) { return [t.programa || t.titulo, t.esporte, t.funcao].join(' '); },
        singular: ' participação',
        plural: ' participações',
        vazio: 'Nenhum programa encontrado.'
      });

      preencherLista('lista-materias', materias, cartaoMateria, 'O site da Faculdade de Comunicação Social (FCS) da UERJ está fora do ar. Em breve as matérias estarão disponíveis aqui!');
    });
  </script>
</body>
</html>
