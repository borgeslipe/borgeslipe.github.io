<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BORGESSFUT</title>
    <meta name="description" content="Conteúdos mais aprofundados, notícias exclusivas e projetos sobre futebol, por Felipe Borges.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BORGESSFUT">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://borgessfut.com.br/">
  <meta property="og:title" content="BORGESSFUT - Futebol com mais profundidade">
  <meta property="og:description" content="Conteúdos mais aprofundados, notícias exclusivas e projetos sobre futebol, por Felipe Borges.">
  <meta property="og:image" content="https://borgessfut.com.br/compartilhar.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo do BORGESSFUT">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BORGESSFUT - Futebol com mais profundidade">
  <meta name="twitter:description" content="Conteúdos mais aprofundados, notícias exclusivas e projetos sobre futebol, por Felipe Borges.">
  <meta name="twitter:image" content="https://borgessfut.com.br/compartilhar.jpg">
  <link rel="icon" href="logo-site.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="cabecalho"></div>

  <div class="capa">
    <div class="capa-conteudo">

      <div class="capa-texto">
        <h1 id="titulo"></h1>
        <p id="texto"></p>
        <a href="noticias.html" class="botao">Ver notícias</a>
      </div>

      <aside class="capa-projetos" id="capa-projetos">
        <a class="ver-todos" href="projetos.html">Ver todos os projetos →</a>
      </aside>

    </div>

    <div class="bolas" id="bolas"></div>
  </div>

  <div id="rodape"></div>
    <section class="ultimas" id="ultimas">
    <div class="ultimas-topo">
      <h2>Últimas notícias</h2>
      <a class="ver-todas" href="noticias.html">Ver todas as notícias ▶</a>
    </div>
    <div id="ultimas-area"></div>
  </section>
  <script src="site.js"></script>
  <script>
    function slug(t) {
      return (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }
    function el(tag, cls, txt) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (txt) e.textContent = txt;
      return e;
    }

    fetch('content/home.json')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById('titulo').textContent = d.titulo;
        document.getElementById('texto').textContent = d.texto;
      });

    // Cartões dos projetos na capa (vêm do painel)
    fetch('content/projetos.json')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var aside = document.getElementById('capa-projetos');
        var ver = aside.querySelector('.ver-todos');
        (d.itens || []).slice(0, 3).forEach(function (p) {
          var a = el('a', 'projeto-card');
          a.href = 'projeto.html?p=' + slug(p.nome);
          if (p.imagem) {
            var im = el('img');
            im.src = p.imagem;
            im.alt = p.nome;
            a.appendChild(im);
          } else {
            a.appendChild(el('span', '', p.nome));
          }
          aside.insertBefore(a, ver);
        });
      });

    // Bolinhas do rodapé da capa
        // ---------- Últimas notícias ----------
    // Troque para true se você ativou o programa que gera as páginas de cada notícia
    var PAGINAS_PRONTAS = true;

    var MESES_CURTOS = ['jan.', 'fev.', 'mar.', 'abr.', 'mai.', 'jun.', 'jul.', 'ago.', 'set.', 'out.', 'nov.', 'dez.'];

    function dataLonga(s) {
      var p = (s || '').slice(0, 10).split('-');
      if (p.length !== 3) return '';
      return Number(p[2]) + ' de ' + MESES_CURTOS[Number(p[1]) - 1] + ' de ' + p[0];
    }
    function idDe(n) {
      return slug(n.titulo) + '-' + (n.data || '').slice(0, 10);
    }
    function linkNoticia(n) {
      return PAGINAS_PRONTAS ? 'noticia/' + idDe(n) + '.html' : 'noticias.html?n=' + idDe(n);
    }

    function fotoDe(n, caixa) {
      if (!n.imagem) return;
      var im = el('img');
      im.src = n.imagem;
      im.alt = '';
      im.loading = 'lazy';
      caixa.appendChild(im);
    }

    function cartaoDestaque(n) {
      var a = el('a', 'destaque');
      a.href = linkNoticia(n);

      var texto = el('div', 'destaque-texto');
      texto.appendChild(el('span', 'etiqueta', 'Futebol'));
      texto.appendChild(el('h3', '', n.titulo));
      if (n.subtitulo) texto.appendChild(el('p', 'destaque-sub', n.subtitulo));
      if (n.data) texto.appendChild(el('p', 'destaque-data', dataLonga(n.data)));
      texto.appendChild(el('span', 'card-ler', 'Ler a notícia ▶'));
      a.appendChild(texto);

      var capa = el('div', 'destaque-capa');
      fotoDe(n, capa);
      a.appendChild(capa);
      return a;
    }

    function cartaoNoticia(n) {
      var a = el('a', 'card-noticia');
      a.href = linkNoticia(n);

      var capa = el('div', 'card-capa');
      fotoDe(n, capa);
      a.appendChild(capa);

      var corpo = el('div', 'card-corpo');
      corpo.appendChild(el('h3', '', n.titulo));
      if (n.data) corpo.appendChild(el('p', 'card-data', dataLonga(n.data)));
      corpo.appendChild(el('span', 'card-ler', 'Ler a notícia ▶'));
      a.appendChild(corpo);
      return a;
    }

    var areaUltimas = document.getElementById('ultimas-area');
    fetch('content/noticias.json')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var itens = (d.itens || [])
          .filter(function (n) { return n.secao !== 'Outros esportes'; })
          .sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); });

        if (!itens.length) {
          areaUltimas.appendChild(el('p', 'vazio', 'Nenhuma notícia publicada ainda.'));
          return;
        }

        areaUltimas.appendChild(cartaoDestaque(itens[0]));

        var outras = itens.slice(1, 4);
        if (outras.length) {
          var grade = el('div', 'cards-noticias');
          outras.forEach(function (n) { grade.appendChild(cartaoNoticia(n)); });
          areaUltimas.appendChild(grade);
        }
      })
      .catch(function () {
        areaUltimas.appendChild(el('p', 'vazio', 'Não foi possível carregar as notícias.'));
      });
    var BOLA =
      '<svg viewBox="-18 -18 36 36" aria-hidden="true">' +
      '<circle r="16" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
      [0, 72, 144, 216, 288].map(function (a) {
        return '<polygon points="0,4.5 -4.3,1.4 -2.7,-3.6 2.7,-3.6 4.3,1.4" ' +
          'transform="rotate(' + a + ') translate(0,-8.6)" ' +
          'fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>';
      }).join('') +
      '</svg>';

    var cores = ['#ffffff', '#cfe6ff', '#8cc8ff', '#ffffff', '#5db3ff'];
    var cont = document.getElementById('bolas');
    var bolas = [];
    for (var i = 0; i < 16; i++) {
      var b = document.createElement('div');
      b.className = 'bola';
      b.style.color = cores[i % cores.length];
      b.innerHTML = BOLA;
      b.firstChild.style.animationDelay = (i * -0.23) + 's';
      b.firstChild.style.animationDuration = (1.4 + (i % 4) * 0.25) + 's';
      cont.appendChild(b);
      bolas.push(b);
    }

    // As bolas perto do mouse crescem
    var capa = document.querySelector('.capa');
    capa.addEventListener('mousemove', function (e) {
      bolas.forEach(function (b) {
        var r = b.getBoundingClientRect();
        var d = Math.abs(r.left + r.width / 2 - e.clientX);
        var s = 1 + Math.max(0, 1 - d / 180) * 0.9;
        b.style.transform = 'scale(' + s + ')';
      });
    });
    capa.addEventListener('mouseleave', function () {
      bolas.forEach(function (b) { b.style.transform = ''; });
    });
  </script>
</body>
</html>
