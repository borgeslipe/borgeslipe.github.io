<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BORGESSFUT</title>
  <link rel="icon" href="logo,png.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="cabecalho"></div>

  <img src="banner.png.png" alt="BORGESSFUT" class="banner">

  <div class="intro">
    <h1 id="titulo"></h1>
    <p id="texto"></p>
    <a href="noticias.html" class="botao">Ver notícias</a>
  </div>

  <div id="rodape"></div>
  <script src="site.js"></script>
  <script>
    fetch('content/home.json')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById('titulo').textContent = d.titulo;
        document.getElementById('texto').textContent = d.texto;
      });
  </script>
</body>
</html>
