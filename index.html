<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BORGESSFUT</title>
  <link rel="icon" href="logo,png.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="cabecalho"></div>

  <div class="capa">
    <div class="capa-conteudo">

      <div class="capa-texto">
        <h1 id="titulo"></h1>
        <p id="texto"></p>
        <a href="noticias.html" class="botao">Ver notícias</a>
      </div>

      <aside class="capa-projetos">
        <a class="projeto-card" href="projeto.html?p=entrevistas">
          <img src="entrevistas.png" alt="" onload="this.parentNode.classList.add('com-logo')" onerror="this.style.display='none'">
          <span>Entrevistas</span>
        </a>
        <a class="projeto-card" href="projeto.html?p=1-minuto">
          <img src="1minuto.png" alt="" onload="this.parentNode.classList.add('com-logo')" onerror="this.style.display='none'">
          <span>1 Minuto</span>
        </a>
        <a class="projeto-card" href="projeto.html?p=textos">
          <img src="textos.png" alt="" onload="this.parentNode.classList.add('com-logo')" onerror="this.style.display='none'">
          <span>Textos</span>
        </a>
        <a class="ver-todos" href="projetos.html">Ver todos os projetos →</a>
      </aside>

    </div>

    <div class="bolas" id="bolas"></div>
  </div>

  <div id="rodape"></div>
  <script src="site.js"></script>
  <script>
    fetch('content/home.json')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById('titulo').textContent = d.titulo;
        document.getElementById('texto').textContent = d.texto;
      });

    // Bolinhas do rodapé da capa
    var BOLA =
      '<svg viewBox="-18 -18 36 36" aria-hidden="true">' +
      '<circle r="16" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
      [0, 72, 144, 216, 288].map(function (a) {
        return '<polygon points="0,4.5 -4.3,1.4 -2.7,-3.6 2.7,-3.6 4.3,1.4" ' +
          'transform="rotate(' + a + ') translate(0,-8.6)" ' +
          'fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>';
      }).join('') +
      '</svg>';

    var cores = ['#ffffff', '#cfe6ff', '#8cc8ff', '#ffffff', '#5db3ff'];
    var cont = document.getElementById('bolas');
    var bolas = [];
    for (var i = 0; i < 16; i++) {
      var b = document.createElement('div');
      b.className = 'bola';
      b.style.color = cores[i % cores.length];
      b.innerHTML = BOLA;
      b.firstChild.style.animationDelay = (i * -0.23) + 's';
      b.firstChild.style.animationDuration = (1.4 + (i % 4) * 0.25) + 's';
      cont.appendChild(b);
      bolas.push(b);
    }

    // As bolas perto do mouse crescem
    var capa = document.querySelector('.capa');
    capa.addEventListener('mousemove', function (e) {
      bolas.forEach(function (b) {
        var r = b.getBoundingClientRect();
        var d = Math.abs(r.left + r.width / 2 - e.clientX);
        var s = 1 + Math.max(0, 1 - d / 180) * 0.9;
        b.style.transform = 'scale(' + s + ')';
      });
    });
    capa.addEventListener('mouseleave', function () {
      bolas.forEach(function (b) { b.style.transform = ''; });
    });
  </script>
</body>
</html>
