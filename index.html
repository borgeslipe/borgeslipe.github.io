<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BORGESSFUT</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    h1 { color: #222; }
  </style>
</head>
<body>
  <h1 id="titulo"></h1>
  <p id="texto"></p>
  <script>
    fetch('content/home.json')
      .then(r => r.json())
      .then(d => {
        document.getElementById('titulo').textContent = d.titulo;
        document.getElementById('texto').textContent = d.texto;
      });
  </script>
</body>
</html>
