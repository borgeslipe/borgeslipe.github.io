<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BORGESSFUT</title>
  <link rel="icon" href="logo,png.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header>
    <a href="#inicio" class="marca">
      <img src="logo,png.png" alt="Logo BORGESSFUT">
      <span>BORGESSFUT</span>
    </a>
    <nav>
      <a href="#sobre">Sobre</a>
      <a href="#noticias">Notícias</a>
      <a href="#projetos">Projetos</a>
      <a href="#contato">Contato</a>
    </nav>
  </header>

  <img src="banner.png.png" alt="BORGESSFUT" class="banner" id="inicio">

  <div class="intro">
    <h1 id="titulo"></h1>
    <p id="texto"></p>
    <a href="#noticias" class="botao">Ver notícias</a>
  </div>

  <section class="clara" id="sobre">
    <h2>Sobre</h2>
    <p>Escreva aqui uma apresentação sobre você e o seu trabalho.</p>
  </section>

  <section id="noticias">
    <h2>Notícias</h2>
    <div class="cards" id="lista-noticias"></div>
  </section>

  <section class="clara" id="projetos">
    <h2>Projetos</h2>
    <div class="cards" id="lista-projetos"></div>
  </section>

  <section id="contato">
    <h2>Contato</h2>
    <p>Coloque aqui seu e-mail ou suas redes sociais.</p>
  </section>

  <footer>© BORGESSFUT</footer>

  <script>
    function slug(t) {
      return (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }
    function el(tag, cls, txt) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (txt) e.textContent = txt;
      return e;
    }
    function dataBR(s) {
      var p = (s || '').slice(0, 10).split('-');
      return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : '';
    }

    fetch('content/home.json')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById('titulo').textContent = d.titulo;
        document.getElementById('texto').textContent = d.texto;
      });

    fetch('content/noticias.json')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var lista = document.getElementById('lista-noticias');
        var itens = (d.itens || []).slice().sort(function (a, b) {
          return (b.data || '').localeCompare(a.data || '');
        });
        itens.forEach(function (n) {
          var c = el('div', 'card');
          if (n.imagem) { var im = el('img'); im.src = n.imagem; im.alt = n.titulo; c.appendChild(im); }
          if (n.data) c.appendChild(el('p', 'data', dataBR(n.data)));
          c.appendChild(el('h3', '', n.titulo));
          c.appendChild(el('p', '', n.texto));
          if (n.link && /^https?:\/\//.test(n.link)) {
            var a = el('a', 'mais', 'Ler mais →');
            a.href = n.link; a.target = '_blank'; a.rel = 'noopener';
            c.appendChild(a);
          }
          lista.appendChild(c);
        });
      });

    fetch('content/projetos.json')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var lista = document.getElementById('lista-projetos');
        (d.itens || []).forEach(function (p) {
          var c = el('div', 'card');
          if (p.imagem) { var im = el('img'); im.src = p.imagem; im.alt = p.nome; c.appendChild(im); }
          c.appendChild(el('h3', '', p.nome));
          c.appendChild(el('p', '', p.resumo));
          var a = el('a', 'mais', 'Ver projeto →');
          a.href = 'projeto.html?p=' + slug(p.nome);
          c.appendChild(a);
          lista.appendChild(c);
        });
      });
  </script>
</body>
</html>
